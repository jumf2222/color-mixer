<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Mixer</title>
<style>
  :root {
    --bg: #f6f1e7;
    --panel: #fffdf8;
    --ink: #2b2620;
    --muted: #8a8174;
    --line: #e4dccd;
    --accent: #3d6bd8;
    --good: #2f9e5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center;
  }
  .game { width: 100%; max-width: 720px; padding: 20px 16px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  .level-tag { font-size: 14px; color: var(--muted); }
  .levels { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 18px; }
  .lvl-btn {
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font-weight: 600; cursor: pointer;
  }
  .lvl-btn.done { background: #e3f3e9; border-color: #b7dfc6; }
  .lvl-btn.current { outline: 2px solid var(--accent); outline-offset: 1px; }
  .lvl-btn:disabled { opacity: .35; cursor: not-allowed; }

  .stage {
    background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
    padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
  }
  .card { text-align: center; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
  .swatch {
    width: 100%; aspect-ratio: 1; max-width: 220px; margin: 0 auto; border-radius: 50%;
    border: 6px solid #fff; box-shadow: 0 6px 20px rgba(0,0,0,.12), inset 0 -10px 20px rgba(0,0,0,.08);
    transition: background-color .35s ease;
  }
  .bowl { position: relative; }
  .bowl.empty { background: repeating-linear-gradient(45deg, #f1ece2 0 10px, #e9e2d5 10px 20px); }
  .bowl.splash { animation: splash .35s ease; }
  @keyframes splash { 0% { transform: scale(1); } 40% { transform: scale(1.05); } 100% { transform: scale(1); } }
  .target-name { margin-top: 10px; font-weight: 700; font-size: 18px; }
  .drops-info { margin-top: 10px; font-size: 14px; color: var(--muted); min-height: 20px; }

  .meter { grid-column: 1 / -1; }
  .meter-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .bar { height: 12px; background: #eee6d8; border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease, background .3s; }

  .paints { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin: 22px 0 8px; }
  .paint {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: none; border: none; cursor: pointer; font: inherit; color: var(--ink); padding: 0;
  }
  .pot {
    width: 64px; height: 64px; border-radius: 50%; border: 4px solid #fff;
    box-shadow: 0 4px 12px rgba(0,0,0,.15); position: relative; transition: transform .1s;
  }
  .paint:hover .pot { transform: translateY(-3px); }
  .paint:active .pot { transform: scale(.92); }
  .pot .count {
    position: absolute; top: -8px; right: -8px; min-width: 24px; height: 24px; padding: 0 6px;
    border-radius: 99px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 700;
    display: none; align-items: center; justify-content: center;
  }
  .pot .count.show { display: flex; }
  .paint span { font-size: 13px; font-weight: 600; }

  .controls { display: flex; justify-content: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .btn {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    padding: 10px 18px; border-radius: 12px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .hint { text-align: center; color: var(--muted); font-size: 14px; margin-top: 14px; min-height: 20px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(30,25,20,.45); display: none;
    align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--panel); border-radius: 20px; padding: 28px; max-width: 360px; width: 100%;
    text-align: center; animation: pop .3s ease;
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal h3 { margin: 0 0 6px; font-size: 24px; }
  .stars { font-size: 36px; letter-spacing: 4px; margin: 8px 0; color: #f2b632; }
  .stars .off { color: #ddd3c2; }
  .modal p { color: var(--muted); margin: 6px 0 18px; }

  @media (max-width: 520px) {
    .stage { grid-template-columns: 1fr 1fr; padding: 14px; gap: 12px; }
    .pot { width: 54px; height: 54px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "solid-js": "https://cdn.jsdelivr.net/npm/solid-js@2.0.4/dist/solid.js",
    "solid-js/internal": "https://cdn.jsdelivr.net/npm/solid-js@2.0.4/dist/internal.js",
    "@solidjs/signals": "https://cdn.jsdelivr.net/npm/@solidjs/signals@2.0.4/dist/prod/index.js",
    "@solidjs/web": "https://cdn.jsdelivr.net/npm/@solidjs/web@2.0.4/dist/web.js",
    "@solidjs/html": "https://cdn.jsdelivr.net/npm/@solidjs/html@2.0.2/dist/html.js"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<script type="module">
import { createSignal, createMemo, For } from "solid-js";
import { render } from "@solidjs/web";
import html from "@solidjs/html";

const h = html.define({ For });

// ---------- Paints ----------
// Each paint lives in RYB (red, yellow, blue) space, 0..1.
// White = no pigment, Black = all pigment. Mixing in RYB behaves like real paint:
// red + yellow = orange, yellow + blue = green, red + blue = purple.
const PAINTS = {
  red:    { name: "Red",    ryb: [1, 0, 0] },
  yellow: { name: "Yellow", ryb: [0, 1, 0] },
  blue:   { name: "Blue",   ryb: [0, 0, 1] },
  white:  { name: "White",  ryb: [0, 0, 0] },
  black:  { name: "Black",  ryb: [1, 1, 1] },
};

// ---------- Levels ----------
// paints: the colors you get this level. recipe: drops that make the target.
const LEVELS = [
  { target: "Orange",     paints: ["red", "yellow"],                          recipe: { red: 1, yellow: 1 } },
  { target: "Green",      paints: ["yellow", "blue"],                         recipe: { yellow: 1, blue: 1 } },
  { target: "Purple",     paints: ["red", "blue"],                            recipe: { red: 1, blue: 1 } },
  { target: "Pink",       paints: ["red", "white"],                           recipe: { red: 1, white: 1 } },
  { target: "Sky Blue",   paints: ["blue", "white", "yellow"],                recipe: { blue: 1, white: 2 } },
  { target: "Lime",       paints: ["yellow", "blue", "red"],                  recipe: { yellow: 2, blue: 1 } },
  { target: "Red-Orange", paints: ["red", "yellow", "blue"],                  recipe: { red: 2, yellow: 1 } },
  { target: "Magenta",    paints: ["red", "blue", "yellow"],                  recipe: { red: 2, blue: 1 } },
  { target: "Brown",      paints: ["red", "yellow", "black", "white"],        recipe: { red: 1, yellow: 1, black: 1 } },
  { target: "Peach",      paints: ["red", "yellow", "blue", "white"],         recipe: { red: 1, yellow: 1, white: 2 } },
  { target: "Lavender",   paints: ["red", "blue", "yellow", "white"],         recipe: { red: 1, blue: 1, white: 2 } },
  { target: "Teal",       paints: ["yellow", "blue", "white", "red"],         recipe: { yellow: 1, blue: 2, white: 1 } },
  { target: "Olive",      paints: ["red", "yellow", "blue", "black", "white"], recipe: { yellow: 2, blue: 1, black: 1 } },
  { target: "Gray",       paints: ["red", "yellow", "blue", "black", "white"], recipe: { black: 1, white: 2 } },
  { target: "Navy",       paints: ["red", "yellow", "blue", "black", "white"], recipe: { blue: 2, black: 1 } },
  { target: "Gold",       paints: ["red", "yellow", "blue", "black", "white"], recipe: { yellow: 3, red: 1 } },
];

// ---------- Color math ----------
// RYB -> RGB by trilinear interpolation over the RYB cube corners
// (Gossett & Chen, "Paint Inspired Color Compositing").
const CUBE = {
  "000": [1, 1, 1],           // white
  "100": [1, 0, 0],           // red
  "010": [1, 1, 0],           // yellow
  "001": [0.163, 0.373, 0.6], // blue
  "110": [1, 0.5, 0],         // orange
  "101": [0.5, 0, 0.5],       // purple
  "011": [0, 0.66, 0.2],      // green
  "111": [0.2, 0.094, 0.0],   // black
};
function rybToRgb([r, y, b]) {
  const out = [0, 0, 0];
  for (const [key, col] of Object.entries(CUBE)) {
    const w = (key[0] === "1" ? r : 1 - r) * (key[1] === "1" ? y : 1 - y) * (key[2] === "1" ? b : 1 - b);
    for (let i = 0; i < 3; i++) out[i] += w * col[i];
  }
  return out.map(v => Math.round(Math.min(1, Math.max(0, v)) * 255));
}

// Mix drops: average the pigment, then rescale so two full-strength paints
// stay full-strength (red + yellow = vivid orange, not pale orange).
function mix(drops) {
  let total = 0, strength = 0;
  const sum = [0, 0, 0];
  for (const [id, n] of Object.entries(drops)) {
    if (!n) continue;
    const p = PAINTS[id].ryb;
    total += n;
    for (let i = 0; i < 3; i++) sum[i] += p[i] * n;
    strength += Math.max(...p) * n;
  }
  if (!total) return null;
  const avg = sum.map(v => v / total);
  const maxC = Math.max(...avg);
  strength /= total;
  return rybToRgb(maxC > 0 ? avg.map(v => v * strength / maxC) : avg);
}

function rgbToLab([R, G, B]) {
  const lin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const r = lin(R), g = lin(G), b = lin(B);
  const f = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
  const x = f((r * 0.4124 + g * 0.3576 + b * 0.1805) / 0.95047);
  const y = f(r * 0.2126 + g * 0.7152 + b * 0.0722);
  const z = f((r * 0.0193 + g * 0.1192 + b * 0.9505) / 1.08883);
  return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
}
const deltaE = (a, b) => { const A = rgbToLab(a), B = rgbToLab(b); return Math.hypot(A[0] - B[0], A[1] - B[1], A[2] - B[2]); };
const css = rgb => `rgb(${rgb.join(",")})`;
const countDrops = history => history.reduce((d, id) => (d[id] = (d[id] || 0) + 1, d), {});
const recipeSize = L => Object.values(L.recipe).reduce((a, b) => a + b, 0);
const WIN_DISTANCE = 3;

// ---------- Saved progress (stars per level) ----------
const SAVE_KEY = "color-mixer-progress";
function loadProgress() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch { return {}; } }
function saveProgress(p) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(p)); } catch {} }
const firstUnbeaten = p => { let i = 0; while (i < LEVELS.length - 1 && p[i]) i++; return i; };

function App() {
  const [progress, setProgress] = createSignal(loadProgress());
  const [levelIdx, setLevelIdx] = createSignal(firstUnbeaten(progress()));
  const [history, setHistory] = createSignal([]);   // paint ids in the order dropped
  const [won, setWon] = createSignal(false);
  const [showWin, setShowWin] = createSignal(false);
  const [stars, setStars] = createSignal(0);
  const [hintStep, setHintStep] = createSignal(0);

  const level = createMemo(() => LEVELS[levelIdx()]);
  const targetRgb = createMemo(() => mix(level().recipe));
  const drops = createMemo(() => countDrops(history()));
  const mixRgb = createMemo(() => mix(drops()));
  const matchPct = createMemo(() => {
    const rgb = mixRgb();
    return rgb ? Math.max(0, Math.round(100 - deltaE(rgb, targetRgb()) * 1.5)) : 0;
  });
  const maxUnlocked = createMemo(() => firstUnbeaten(progress()));

  let bowlEl;
  const splash = () => { if (!bowlEl) return; bowlEl.classList.remove("splash"); void bowlEl.offsetWidth; bowlEl.classList.add("splash"); };

  function loadLevel(i) {
    setLevelIdx(i);
    setHistory([]);
    setWon(false);
    setShowWin(false);
    setHintStep(0);
  }

  // Reads update only after flush in Solid 2.0, so handlers work from local values.
  function addDrop(id) {
    if (won()) return;
    const next = [...history(), id];
    setHistory(next);
    splash();
    const L = level();
    if (deltaE(mix(countDrops(next)), mix(L.recipe)) < WIN_DISTANCE) win(next.length, L);
  }

  function win(used, L) {
    const ideal = recipeSize(L);
    let s = used <= ideal ? 3 : used <= ideal * 2 ? 2 : 1;
    if (hintStep() > 0) s = Math.min(s, 2);
    const idx = levelIdx();
    const p = { ...progress(), [idx]: Math.max(progress()[idx] || 0, s) };
    setProgress(p);
    saveProgress(p);
    setStars(s);
    setWon(true);
    setTimeout(() => setShowWin(true), 450);
  }

  const undo = () => { if (!won()) setHistory(h => h.slice(0, -1)); };
  const clearBowl = () => { if (!won()) setHistory([]); };
  const nextLevel = () => loadLevel(levelIdx() === LEVELS.length - 1 ? 0 : levelIdx() + 1);

  const hintText = createMemo(() => {
    const step = hintStep(), recipe = level().recipe, ids = Object.keys(recipe);
    if (step === 0) return "";
    if (step === 1) return "Uses: " + ids.map(id => PAINTS[id].name).join(" + ");
    return "Recipe: " + ids.map(id => `${recipe[id]} ${PAINTS[id].name}`).join(" + ");
  });

  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "z") { e.preventDefault(); undo(); }
  });

  const levelNums = LEVELS.map((_, i) => i);

  return h`
    <div class="game">
      <header>
        <h1>🎨 Color Mixer</h1>
        <div class="level-tag">${() => `Level ${levelIdx() + 1} of ${LEVELS.length}`}</div>
      </header>

      <div class="levels">
        <For each=${levelNums}>
          ${i => h`
            <button
              class=${() => "lvl-btn" + (progress()[i] ? " done" : "") + (i === levelIdx() ? " current" : "")}
              disabled=${() => i > maxUnlocked()}
              title=${() => progress()[i] ? "★".repeat(progress()[i]) : ""}
              onClick=${() => loadLevel(i)}
            >${i + 1}</button>`}
        </For>
      </div>

      <div class="stage">
        <div class="card">
          <h2>Make this</h2>
          <div class="swatch" style=${() => `background-color:${css(targetRgb())}`}></div>
          <div class="target-name">${() => level().target}</div>
        </div>
        <div class="card">
          <h2>Your mix</h2>
          <div
            ref=${el => (bowlEl = el)}
            class=${() => "swatch bowl" + (mixRgb() ? "" : " empty")}
            style=${() => mixRgb() ? `background-color:${css(mixRgb())}` : ""}
          ></div>
          <div class="drops-info">${() => {
            const n = history().length;
            return n ? `${n} drop${n === 1 ? "" : "s"}` : "Tap a paint to add a drop";
          }}</div>
        </div>
        <div class="meter">
          <div class="meter-row"><span>Match</span><strong>${() => matchPct() + "%"}</strong></div>
          <div class="bar"><div style=${() => {
            const p = matchPct();
            const color = p >= 95 ? "var(--good)" : p >= 75 ? "#e0a422" : "var(--accent)";
            return `width:${p}%;background:${color}`;
          }}></div></div>
        </div>
      </div>

      <div class="paints">
        <For each=${() => level().paints}>
          ${id => h`
            <button class="paint" onClick=${() => addDrop(id)}>
              <div class="pot" style=${`background:${css(rybToRgb(PAINTS[id].ryb))}`}>
                <div class=${() => "count" + (drops()[id] ? " show" : "")}>${() => drops()[id] || 0}</div>
              </div>
              <span>${PAINTS[id].name}</span>
            </button>`}
        </For>
      </div>

      <div class="controls">
        <button class="btn" disabled=${() => !history().length} onClick=${undo}>↶ Undo</button>
        <button class="btn" disabled=${() => !history().length} onClick=${clearBowl}>Empty bowl</button>
        <button class="btn" onClick=${() => setHintStep(s => Math.min(s + 1, 2))}>💡 Hint</button>
      </div>
      <div class="hint">${hintText}</div>
    </div>

    <div class=${() => "overlay" + (showWin() ? " show" : "")}>
      <div class="modal">
        <h3>${() => stars() === 3 ? "Perfect match!" : "You made it!"}</h3>
        <div class="stars">
          <For each=${[1, 2, 3]}>
            ${s => h`<span class=${() => s <= stars() ? "" : "off"}>★</span>`}
          </For>
        </div>
        <p>${() => {
          const used = history().length, ideal = recipeSize(level());
          return `${level().target} in ${used} drop${used === 1 ? "" : "s"}` +
            (stars() < 3 ? ` — can you do it in ${ideal}?` : "");
        }}</p>
        <button class="btn primary" onClick=${nextLevel}>
          ${() => levelIdx() === LEVELS.length - 1 ? "Play again" : "Next level →"}
        </button>
      </div>
    </div>
  `;
}

render(App, document.getElementById("app"));
</script>
</body>
</html>
